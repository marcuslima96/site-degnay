<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcus ❤️ Degnay</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:'Inter',sans-serif;
}

/* camadas de fundo */

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background-size:cover;
background-position:center;

transition:opacity 2s ease;
}

#bg1{z-index:-2;}
#bg2{z-index:-1;opacity:0;}

/* overlay */

.overlay{

position:absolute;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.35);
backdrop-filter: blur(1px);

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

text-align:center;

color:white;

padding:30px;

}

/* título */

h1{
font-family:'Playfair Display',serif;
font-size:40px;
margin-bottom:25px;
text-shadow:0 2px 10px rgba(0,0,0,0.6);
}

/* botão */

button{

background:linear-gradient(45deg,#ff4e8a,#ff7eb3);

border:none;

color:white;

padding:15px 35px;

font-size:18px;

border-radius:40px;

cursor:pointer;

box-shadow:0 10px 30px rgba(0,0,0,0.4);

}

/* mensagem */

.mensagem{

max-width:700px;

font-size:22px;

line-height:1.6;

margin-top:25px;

min-height:120px;

text-shadow:0 2px 10px rgba(0,0,0,0.6);

}

/* contador */

.contador{

margin-top:20px;
font-size:20px;
opacity:0.9;
text-shadow:0 2px 10px rgba(0,0,0,0.6);

}

</style>

</head>

<body>

<div id="bg1" class="bg"></div>
<div id="bg2" class="bg"></div>

<div class="overlay">

<div id="intro">

<h1>Marcus ❤️ Degnay</h1>

<button onclick="iniciar()">
Clique para sua surpresa
</button>

</div>

<div class="mensagem" id="mensagem"></div>

<div class="contador" id="contador"></div>

</div>

<audio id="musica">
<source src="musica.mp3">
</audio>

<script>

/* fotos */

var fotos=[
"foto1.jpg",
"foto2.jpg",
"foto3.jpg",
"foto4.jpg"
];

var atual=0;
var mostrandoBg1=true;

function slide(){

var proxima=(atual+1)%fotos.length;

if(mostrandoBg1){

document.getElementById("bg2").style.backgroundImage="url("+fotos[proxima]+")";
document.getElementById("bg2").style.opacity=1;
document.getElementById("bg1").style.opacity=0;

}else{

document.getElementById("bg1").style.backgroundImage="url("+fotos[proxima]+")";
document.getElementById("bg1").style.opacity=1;
document.getElementById("bg2").style.opacity=0;

}

mostrandoBg1=!mostrandoBg1;
atual=proxima;

}

document.getElementById("bg1").style.backgroundImage="url("+fotos[0]+")";

setInterval(slide,6000);

/* contador dias */

var inicio = new Date("2025-12-13");

function atualizar(){

var agora=new Date();

var diff=agora-inicio;

var dias=Math.floor(diff/(1000*60*60*24));

document.getElementById("contador").innerHTML=
"Já são "+dias+" dias ao seu lado ❤️";

}

setInterval(atualizar,1000);

atualizar();

/* texto digitando */

var texto=`Degnay,

Hoje completamos 3 meses juntos.

Obrigado por esses 3 meses incríveis
ao seu lado.

❤️`;

var pos=0;

function digitar(){

if(pos < texto.length){

document.getElementById("mensagem").innerHTML += texto.charAt(pos);

pos++;

setTimeout(digitar,40);

}

}

/* iniciar surpresa */

function iniciar(){

document.getElementById("intro").style.display="none";

document.getElementById("musica").play();

digitar();

}

</script>

</body>

</html>
