<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcus ❤️ Degnay</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
}

body{
background:#0f0f1a;
color:white;
overflow-x:hidden;
}

/* fundo partículas */

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* intro */

.intro{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.intro h1{
font-size:38px;
margin-bottom:20px;
}

.start{
padding:16px 40px;
border:none;
border-radius:40px;
font-size:20px;
cursor:pointer;
background:linear-gradient(45deg,#ff4e8a,#ff7eb3);
color:white;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* main */

.main{
display:none;
max-width:700px;
margin:auto;
padding:25px;
text-align:center;
}

/* contador */

.contador{
font-size:22px;
margin:20px 0;
}

/* galeria */

.galeria{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.galeria img{
width:100%;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.4);
transition:0.3s;
}

.galeria img:hover{
transform:scale(1.05);
}

/* mensagem */

.mensagem{
margin-top:25px;
font-size:20px;
line-height:1.6;
min-height:140px;
}

/* player */

.player{
margin-top:20px;
}

.player button{
background:#ff4e8a;
border:none;
color:white;
padding:12px 25px;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

/* corações */

.heart{
position:fixed;
font-size:22px;
animation: subir 5s linear;
}

@keyframes subir{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-100vh);
opacity:0;
}
}

</style>

</head>

<body>

<canvas id="bg"></canvas>

<div class="intro">

<h1>Marcus ❤️ Degnay</h1>

<button class="start" onclick="start()">
Clique para sua surpresa
</button>

</div>

<div class="main" id="main">

<h2>3 meses de nós dois ❤️</h2>

<div class="contador" id="contador"></div>

<div class="mensagem" id="mensagem"></div>

<div class="galeria">

<img src="foto1.jpg">
<img src="foto2.jpg">
<img src="foto3.jpg">
<img src="foto4.jpg">

</div>

<div class="player">
<button onclick="toggleMusic()">🎵 Tocar música</button>
</div>

</div>

<audio id="music">
<source src="musica.mp3">
</audio>

<script>

/* contador */

var inicio = new Date("2025-12-13");

function contador(){

var agora = new Date();
var diff = agora - inicio;

var dias = Math.floor(diff/(1000*60*60*24));
var horas = Math.floor((diff/(1000*60*60))%24);
var min = Math.floor((diff/(1000*60))%60);

document.getElementById("contador").innerHTML =
"Juntos há "+dias+" dias, "+horas+"h "+min+"min ❤️";

}

setInterval(contador,1000);
contador();

/* start */

function start(){

document.querySelector(".intro").style.display="none";
document.getElementById("main").style.display="block";

explodeHearts();
typeText();
music.play();

}

/* mensagem digitando */

var text = `Degnay,

Desde o dia 13 de dezembro minha vida ficou mais bonita.

Esses três meses com você foram cheios de momentos especiais,
risadas e carinho.

Obrigado por fazer parte da minha vida.

Que nossa história continue crescendo
com amor e felicidade.

❤️`;

var i=0;

function typeText(){

if(i < text.length){

document.getElementById("mensagem").innerHTML += text.charAt(i);
i++;

setTimeout(typeText,35);

}

}

/* música */

var music = document.getElementById("music");

function toggleMusic(){

if(music.paused){
music.play();
}else{
music.pause();
}

}

/* explosão corações */

function explodeHearts(){

for(let i=0;i<40;i++){

let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"%";
heart.style.bottom="0";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),5000);

}

}

/* partículas fundo */

var canvas=document.getElementById("bg");
var ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

var particles=[];

for(let i=0;i<80;i++){

particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2
});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

particles.forEach(p=>{

ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();

p.y+=0.2;

if(p.y>canvas.height)p.y=0;

});

requestAnimationFrame(draw);

}

draw();

</script>

</body>

</html>
