<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcus ❤️ Degnay</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#ff4e8a,#ff7eb3);
color:white;
text-align:center;
overflow-x:hidden;
}

/* tela inicial */

.intro{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.intro h1{
font-size:34px;
margin-bottom:20px;
}

.start{
background:white;
color:#ff4e8a;
border:none;
padding:15px 35px;
border-radius:40px;
font-size:20px;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* conteúdo principal */

.main{
display:none;
padding:25px;
max-width:650px;
margin:auto;
}

/* contador */

.contador{
margin:20px 0;
font-size:22px;
font-weight:bold;
}

/* slider */

.slider{
position:relative;
margin-top:20px;
}

.slider img{
width:100%;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* mensagem */

.mensagem{
margin-top:25px;
font-size:20px;
line-height:1.6;
min-height:120px;
}

/* player */

.player{
margin-top:20px;
background:rgba(255,255,255,0.15);
padding:15px;
border-radius:15px;
backdrop-filter:blur(10px);
}

.player button{
background:white;
border:none;
padding:10px 20px;
border-radius:30px;
cursor:pointer;
color:#ff4e8a;
}

/* corações */

.heart{
position:fixed;
bottom:-10px;
font-size:22px;
animation:subir 6s linear infinite;
opacity:0.8;
}

@keyframes subir{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-110vh);
opacity:0;
}

}

</style>

</head>

<body>

<div class="intro">

<h1>Marcus ❤️ Degnay</h1>

<button class="start" onclick="iniciar()">
Clique para ver sua surpresa
</button>

</div>

<div class="main" id="main">

<h2>3 meses de nós dois ❤️</h2>

<div class="contador" id="contador"></div>

<div class="slider">

<img id="foto" src="foto1.jpg">

</div>

<div class="mensagem" id="mensagem"></div>

<div class="player">

<button onclick="toggleMusica()">🎵 Música</button>

</div>

</div>

<audio id="musica">

<source src="musica.mp3" type="audio/mpeg">

</audio>

<script>

/* contador */

var inicio = new Date("2025-12-13");

function atualizar(){

var agora = new Date();

var diff = agora - inicio;

var dias = Math.floor(diff/(1000*60*60*24));
var horas = Math.floor((diff/(1000*60*60))%24);
var min = Math.floor((diff/(1000*60))%60);

document.getElementById("contador").innerHTML =
"Juntos há "+dias+" dias, "+horas+"h e "+min+"min ❤️";

}

setInterval(atualizar,1000);

atualizar();

/* iniciar */

function iniciar(){

document.querySelector(".intro").style.display="none";

document.getElementById("main").style.display="block";

digitar();

}

/* efeito digitação */

var texto = `Degnay,

Desde o dia 13 de dezembro minha vida ficou mais bonita.

Esses três meses com você foram cheios de momentos especiais,
risadas e carinho.

Obrigado por fazer parte da minha vida.

Que nossa história continue crescendo
com amor, parceria e felicidade.

❤️`;

var i=0;

function digitar(){

if(i < texto.length){

document.getElementById("mensagem").innerHTML += texto.charAt(i);

i++;

setTimeout(digitar,40);

}

}

/* slider fotos */

var fotos=[
"foto1.jpg",
"foto2.jpg",
"foto3.jpg",
"foto4.jpg"
];

var f=0;

setInterval(function(){

f++;

if(f>=fotos.length){f=0;}

document.getElementById("foto").src=fotos[f];

},3500);

/* musica */

function toggleMusica(){

var m=document.getElementById("musica");

if(m.paused){

m.play();

}else{

m.pause();

}

}

/* corações */

setInterval(function(){

var heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"%";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),6000);

},400);

</script>

</body>

</html>
