<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcus ❤️ Deg • 4 meses</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:'Inter',sans-serif;
background:black;
}

/* fundo */

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-size:cover;
background-position:center;
transition:opacity 2s ease;
filter: blur(12px) brightness(0.4);
}

#bg1{z-index:-3;}
#bg2{z-index:-2;opacity:0;}

/* story (PC) */

.story{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90vw;
max-width:420px;
height:85vh;

border-radius:25px;
overflow:hidden;

box-shadow:0 20px 60px rgba(0,0,0,0.8);

z-index:-1;
}

.story-img{
width:100%;
height:100%;
background-size:cover;
background-position:center;
transition:opacity 2s ease;
}

#s1{position:absolute;}
#s2{position:absolute;opacity:0;}

/* overlay */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;
color:white;
padding:20px;
}

/* título */

h1{
font-family:'Playfair Display',serif;
font-size:32px;
margin-bottom:20px;
text-shadow:0 2px 15px rgba(0,0,0,0.7);
}

/* botão */

button{
background:linear-gradient(45deg,#ff4e8a,#ff7eb3);
border:none;
color:white;
padding:14px 30px;
font-size:16px;
border-radius:40px;
cursor:pointer;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
transition:all .25s ease;
}

button:hover{
transform:scale(1.05);
}

/* mensagem */

.mensagem{
width:100%;
max-width:360px;

font-size:20px;
line-height:1.8;
letter-spacing:0.5px;

margin:20px auto 0 auto;

min-height:120px;

text-align:center;

text-shadow:0 4px 20px rgba(0,0,0,0.85);
}

/* contador */

.contador{
width:100%;
max-width:360px;

margin:15px auto 0 auto;

font-size:18px;

opacity:0.9;

text-align:center;

text-shadow:0 4px 20px rgba(0,0,0,0.85);
}

/* ajuste PC */

@media (min-width:768px){
.mensagem{
font-size:18px;
}
}

/* celular remove story */

@media (max-width:768px){
.story{
display:none;
}
.bg{
filter:none;
}
}

/* corações */

.heart{
position:fixed;
bottom:-10px;
font-size:18px;
animation:subir 6s linear;
opacity:0.8;
}

@keyframes subir{
0%{transform:translateY(0); opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-100vh); opacity:0;}
}

/* brilho */

.sparkle{
position:fixed;
width:4px;
height:4px;
background:white;
border-radius:50%;
animation:brilho 3s infinite;
}

@keyframes brilho{
0%,100%{opacity:0;}
50%{opacity:1;}
}

</style>

</head>

<body>

<div id="bg1" class="bg"></div>
<div id="bg2" class="bg"></div>

<div class="story">
<div id="s1" class="story-img"></div>
<div id="s2" class="story-img"></div>
</div>

<div class="overlay">

<div id="intro">

<h1>Marcus ❤️ Deg • 4 meses</h1>

<button onclick="iniciar()">
Clique para sua surpresa
</button>

</div>

<div class="mensagem" id="mensagem"></div>

<div class="contador" id="contador"></div>

</div>

<audio id="musica">
<source src="musica.mp3">
</audio>

<script>

/* fotos */

var fotos=[
"foto1.jpg",
"foto2.jpg",
"foto3.jpg",
"foto4.jpg",
"foto5.jpg",
"foto6.jpg"
];

var atual=0;
var toggle=true;

function slide(){

var prox=(atual+1)%fotos.length;

/* fundo */
if(toggle){
bg2.style.backgroundImage="url("+fotos[prox]+")";
bg2.style.opacity=1;
bg1.style.opacity=0;
}else{
bg1.style.backgroundImage="url("+fotos[prox]+")";
bg1.style.opacity=1;
bg2.style.opacity=0;
}

/* story */
if(toggle){
s2.style.backgroundImage="url("+fotos[prox]+")";
s2.style.opacity=1;
s1.style.opacity=0;
}else{
s1.style.backgroundImage="url("+fotos[prox]+")";
s1.style.opacity=1;
s2.style.opacity=0;
}

toggle=!toggle;
atual=prox;

}

bg1.style.backgroundImage="url("+fotos[0]+")";
s1.style.backgroundImage="url("+fotos[0]+")";

setInterval(slide,6000);

/* contador */

var inicio=new Date("2025-12-13");

function atualizar(){
var agora=new Date();
var diff=agora-inicio;
var dias=Math.floor(diff/(1000*60*60*24));
contador.innerHTML="Já são "+dias+" dias ao seu lado ❤️";
}

setInterval(atualizar,1000);
atualizar();

/* mensagem */

var texto=`Deg,

Hoje completamos 4 meses juntos.

Cada dia ao seu lado tem sido especial,
e eu sou muito grato por tudo que estamos vivendo.

Te amo. BITIS 🫰

❤️`;

var i=0;

function digitar(){
if(i<texto.length){
mensagem.innerHTML+=texto.charAt(i);
i++;
setTimeout(digitar,40);
}
}

/* iniciar */

function iniciar(){
intro.style.display="none";
musica.currentTime=67;
musica.play();
setTimeout(digitar,1000);
}

/* corações */

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"%";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},800);

/* brilho */

setInterval(()=>{
let s=document.createElement("div");
s.className="sparkle";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
document.body.appendChild(s);
setTimeout(()=>s.remove(),3000);
},500);

</script>

</body>

</html>
