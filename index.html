<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcus ❤️ Degnay</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;

background-size:cover;
background-position:center;

transition:background-image 2.5s ease;

font-family:'Inter',sans-serif;

}

/* camada escura e blur */

.overlay{

position:absolute;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.45);
backdrop-filter: blur(6px);

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

text-align:center;

color:white;

padding:30px;

}

/* título */

h1{

font-family:'Playfair Display',serif;

font-size:40px;

margin-bottom:25px;

}

/* botão */

button{

background:linear-gradient(45deg,#ff4e8a,#ff7eb3);

border:none;

color:white;

padding:15px 35px;

font-size:18px;

border-radius:40px;

cursor:pointer;

box-shadow:0 10px 30px rgba(0,0,0,0.4);

transition:transform .2s;

}

button:hover{

transform:scale(1.05);

}

/* mensagem */

.mensagem{

max-width:700px;

font-size:22px;

line-height:1.6;

margin-top:25px;

min-height:120px;

}

/* contador */

.contador{

margin-top:20px;

font-size:20px;

opacity:0.9;

}

</style>

</head>

<body>

<div class="overlay">

<div id="intro">

<h1>Marcus ❤️ Degnay</h1>

<button onclick="iniciar()">

Clique para sua surpresa

</button>

</div>

<div class="mensagem" id="mensagem"></div>

<div class="contador" id="contador"></div>

</div>

<audio id="musica">

<source src="musica.mp3">

</audio>

<script>

/* slideshow fundo */

var fotos=[
"foto1.jpg",
"foto2.jpg",
"foto3.jpg",
"foto4.jpg"
];

var fotoIndex=0;

function trocarFoto(){

document.body.style.backgroundImage="url('"+fotos[fotoIndex]+"')";

fotoIndex++;

if(fotoIndex>=fotos.length){

fotoIndex=0;

}

}

setInterval(trocarFoto,6000);

trocarFoto();

/* contador dias */

var inicio = new Date("2025-12-13");

function atualizar(){

var agora=new Date();

var diff=agora-inicio;

var dias=Math.floor(diff/(1000*60*60*24));

document.getElementById("contador").innerHTML=
"Já são "+dias+" dias ao seu lado ❤️";

}

setInterval(atualizar,1000);

atualizar();

/* texto digitando */

var texto=`Degnay,

Hoje completamos 3 meses juntos.

Pode parecer pouco tempo,
mas já foram meses cheios de momentos
muito especiais para mim.

Obrigado por esses 3 meses incríveis
ao seu lado.

❤️`;

var pos=0;

function digitar(){

if(pos < texto.length){

document.getElementById("mensagem").innerHTML += texto.charAt(pos);

pos++;

setTimeout(digitar,40);

}

}

/* iniciar surpresa */

function iniciar(){

document.getElementById("intro").style.display="none";

document.getElementById("musica").play();

digitar();

}

</script>

</body>

</html>
