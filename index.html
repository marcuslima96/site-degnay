<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcus ❤️ Degnay • 4 meses</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:'Inter',sans-serif;
}

/* fundos */

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-size:cover;
background-position:center;
transition:opacity 2s ease;
}

#bg1{z-index:-2;}
#bg2{z-index:-1;opacity:0;}

/* overlay */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:rgba(0,0,0,0.35);
backdrop-filter: blur(1px);

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
color:white;
padding:30px;
}

/* título */

h1{
font-family:'Playfair Display',serif;
font-size:34px;
margin-bottom:25px;
text-shadow:0 2px 10px rgba(0,0,0,0.6);
}

/* botão */

button{
background:linear-gradient(45deg,#ff4e8a,#ff7eb3);
border:none;
color:white;
padding:15px 35px;
font-size:18px;
border-radius:40px;
cursor:pointer;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
transition:all .25s ease;
}

button:hover{
transform:scale(1.06);
}

/* mensagem */

.mensagem{
max-width:700px;
font-size:22px;
line-height:1.8;
letter-spacing:0.5px;
margin-top:25px;
min-height:120px;
text-shadow:0 2px 10px rgba(0,0,0,0.6);
}

/* contador */

.contador{
margin-top:20px;
font-size:20px;
opacity:0.9;
text-shadow:0 2px 10px rgba(0,0,0,0.6);
}

/* corações */

.heart{
position:fixed;
bottom:-10px;
font-size:18px;
animation: subir 6s linear;
opacity:0.8;
}

@keyframes subir{
0%{transform:translateY(0); opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-100vh); opacity:0;}
}

/* brilho */

.sparkle{
position:fixed;
width:4px;
height:4px;
background:white;
border-radius:50%;
opacity:0.7;
animation: brilho 3s infinite;
}

@keyframes brilho{
0%,100%{opacity:0;}
50%{opacity:1;}
}

</style>

</head>

<body>

<div id="bg1" class="bg"></div>
<div id="bg2" class="bg"></div>

<div class="overlay">

<div id="intro">

<h1>Marcus ❤️ Degnay • 4 meses</h1>

<button onclick="iniciar()">
Clique para sua surpresa
</button>

</div>

<div class="mensagem" id="mensagem"></div>

<div class="contador" id="contador"></div>

</div>

<audio id="musica">
<source src="musica.mp3">
</audio>

<script>

/* fotos (adicione quantas quiser) */

var fotos=[
"foto1.jpg",
"foto2.jpg",
"foto3.jpg",
"foto4.jpg",
"foto5.jpg",
"foto6.jpg"
];

var atual=0;
var mostrandoBg1=true;

function slide(){

var proxima=(atual+1)%fotos.length;

if(mostrandoBg1){
bg2.style.backgroundImage="url("+fotos[proxima]+")";
bg2.style.opacity=1;
bg1.style.opacity=0;
}else{
bg1.style.backgroundImage="url("+fotos[proxima]+")";
bg1.style.opacity=1;
bg2.style.opacity=0;
}

mostrandoBg1=!mostrandoBg1;
atual=proxima;

}

bg1.style.backgroundImage="url("+fotos[0]+")";

setInterval(slide,6000);

/* contador */

var inicio = new Date("2025-12-13");

function atualizar(){

var agora=new Date();
var diff=agora-inicio;
var dias=Math.floor(diff/(1000*60*60*24));

contador.innerHTML="Já são "+dias+" dias ao seu lado ❤️";

}

setInterval(atualizar,1000);
atualizar();

/* mensagem nova */

var texto=`Degnay,

Hoje completamos 4 meses juntos.

Cada dia ao seu lado tem sido especial,
e eu sou muito grato por tudo que estamos vivendo.

Obrigado por esses momentos incríveis
e por fazer parte da minha vida.

❤️`;

var pos=0;

function digitar(){

if(pos < texto.length){

mensagem.innerHTML += texto.charAt(pos);

pos++;

setTimeout(digitar,40);

}

}

/* iniciar */

function iniciar(){

intro.style.display="none";

musica.play();

setTimeout(digitar,1000);

}

/* corações */

setInterval(function(){

var h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";

document.body.appendChild(h);

setTimeout(()=>h.remove(),6000);

},800);

/* brilhos */

setInterval(function(){

var s=document.createElement("div");

s.className="sparkle";

s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";

document.body.appendChild(s);

setTimeout(()=>s.remove(),3000);

},500);

</script>

</body>

</html>
