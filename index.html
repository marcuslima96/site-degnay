<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcus ❤️ Degnay</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

/* slideshow fundo */

body{

height:100vh;
overflow:hidden;

background-size:cover;
background-position:center;

transition:background-image 2s ease;

}

/* camada escura */

.overlay{

position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:rgba(0,0,0,0.45);

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;
color:white;
padding:30px;

}

/* intro */

.intro h1{

font-size:38px;
margin-bottom:20px;

}

button{

background:#ff4e8a;
border:none;
color:white;

padding:15px 35px;
font-size:18px;

border-radius:40px;

cursor:pointer;

box-shadow:0 10px 30px rgba(0,0,0,0.4);

}

/* mensagem */

.mensagem{

max-width:700px;

font-size:22px;

line-height:1.7;

margin-top:20px;

min-height:150px;

}

.contador{

margin-top:20px;
font-size:20px;

}

</style>

</head>

<body>

<div class="overlay">

<div class="intro" id="intro">

<h1>Marcus ❤️ Degnay</h1>

<button onclick="iniciar()">

Clique para sua surpresa

</button>

</div>

<div class="mensagem" id="mensagem"></div>

<div class="contador" id="contador"></div>

</div>

<audio id="musica">

<source src="musica.mp3">

</audio>

<script>

/* fotos fundo */

var fotos=[
"foto1.jpg",
"foto2.jpg",
"foto3.jpg",
"foto4.jpg"
];

var i=0;

function slide(){

document.body.style.backgroundImage="url('"+fotos[i]+"')";

i++;

if(i>=fotos.length){i=0;}

}

setInterval(slide,5000);

slide();

/* contador */

var inicio = new Date("2025-12-13");

function atualizar(){

var agora=new Date();

var diff=agora-inicio;

var dias=Math.floor(diff/(1000*60*60*24));
var horas=Math.floor((diff/(1000*60*60))%24);

document.getElementById("contador").innerHTML=
"Juntos há "+dias+" dias e "+horas+" horas ❤️";

}

setInterval(atualizar,1000);

atualizar();

/* mensagem digitando */

var texto=`Degnay,

Desde o dia 13 de dezembro
minha vida ficou muito mais bonita.

Esses três meses com você
foram cheios de momentos especiais,
risadas e carinho.

Obrigado por fazer parte da minha vida.

Que nossa história continue crescendo
com amor, parceria e felicidade.

❤️`;

var pos=0;

function digitar(){

if(pos < texto.length){

document.getElementById("mensagem").innerHTML += texto.charAt(pos);

pos++;

setTimeout(digitar,40);

}

}

/* iniciar */

function iniciar(){

document.getElementById("intro").style.display="none";

document.getElementById("musica").play();

digitar();

}

</script>

</body>

</html>
